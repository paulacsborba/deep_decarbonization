techs:

    demand_electricity:
        essentials:
            name: 'Demand-Electricity'
            carrier: electricity
            parent: demand
        constraints:
            resource: file=demand_baseline_electricity.csv
            resource_scale: 1
            resource_unit: energy

    demand_hydrogen:
        essentials:
            name: 'Demand-Electricity'
            carrier: hydrogen
            parent: demand
        constraints:
            resource: file=demand\demand_hydrogen.csv
            resource_scale: 1
            resource_unit: energy
                      

