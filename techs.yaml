    transmission_lines_free:
        essentials:
            name: 'Free transmission'
            parent: transmission
            carrier: electricity
        constraints:
            energy_cap_max: inf
            energy_eff: 0.95
            lifetime: 25            
        costs:
            monetary:
               interest_rate: 0
               energy_cap: 0
               energy_cap_per_distance: 0
               om_prod: 0

    hydrogen_transport:
        essentials:
            name: 'Free transmission'
            parent: transmission
            carrier: hydrogen
        constraints:
            energy_cap_max: inf
            energy_eff: 1.0
            lifetime: 1
        costs:
            monetary:
               interest_rate: 0
               energy_cap: 0
               om_prod: 0





 
 
 
 
            